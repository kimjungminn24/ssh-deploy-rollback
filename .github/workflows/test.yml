name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: deploy and rollback scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q openssh-server
      - run: bash test/run.sh

  action:
    name: the action itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start a throwaway sshd and a fake app
        run: |
          sudo apt-get install -y -q openssh-server
          w="$RUNNER_TEMP/srv"; mkdir -p "$w/app"
          ssh-keygen -q -t ed25519 -N '' -f "$w/host_key"
          ssh-keygen -q -t ed25519 -N '' -f "$w/client_key"
          cp "$w/client_key.pub" "$w/authorized_keys"; chmod 600 "$w/authorized_keys"
          printf '%s\n' "Port 2222" "ListenAddress 127.0.0.1" "HostKey $w/host_key" \
            "AuthorizedKeysFile $w/authorized_keys" "PasswordAuthentication no" "StrictModes no" "UsePAM no" > "$w/sshd_config"
          sudo mkdir -p /run/sshd && sudo /usr/sbin/sshd -f "$w/sshd_config"
          sleep 1
          python3 test/fake-app.py "$w/app/app.jar" 18080 &
          {
            echo "SRV=$w"
            echo 'KEY<<EOF'; cat "$w/client_key"; echo EOF
            echo "KNOWN=$(ssh-keyscan -p 2222 127.0.0.1 2>/dev/null | head -n 1)"
          } >> "$GITHUB_ENV"

      - run: echo "ok v1" > good.jar
      - id: good
        uses: ./
        with:
          host: 127.0.0.1
          port: '2222'
          user: runner
          key: ${{ env.KEY }}
          known-hosts: ${{ env.KNOWN }}
          artifact: good.jar
          target: ${{ env.SRV }}/app/app.jar
          restart: 'true'
          health-url: http://127.0.0.1:18080/health
          health-expect: UP
          health-timeout: '5'

      - run: echo "broken v2" > bad.jar
      - id: bad
        continue-on-error: true
        uses: ./
        with:
          host: 127.0.0.1
          port: '2222'
          user: runner
          key: ${{ env.KEY }}
          known-hosts: ${{ env.KNOWN }}
          artifact: bad.jar
          target: ${{ env.SRV }}/app/app.jar
          restart: 'true'
          health-url: http://127.0.0.1:18080/health
          health-expect: UP
          health-timeout: '3'

      - name: Check results
        run: |
          test "${{ steps.good.outputs.result }}" = deployed
          test "${{ steps.bad.outcome }}" = failure
          test "${{ steps.bad.outputs.result }}" = rolled-back
          grep -q "ok v1" "$SRV/app/app.jar"
          echo "deploy and rollback both work through the action"
